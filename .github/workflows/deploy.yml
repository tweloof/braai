# .github/workflows/deploy.yml
# Deploys braai.co.za to Cloudflare Pages on every merge to main.
# Runs on GitHub's servers — no laptop, no Claude session, no Drive needed.
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions →
#   New repository secret → name: CLOUDFLARE_API_TOKEN, value: the Cloudflare token.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you hit "Run workflow" by hand from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity checks (same gates the maintainer runs)
        run: |
          set -euo pipefail
          rules=$(grep -cvE '^\s*(#|$)' public/_redirects)
          echo "_redirects rules: $rules"
          [ "$rules" -ge 60 ] || { echo "::error::_redirects has only $rules rules (need 60+)"; exit 1; }
          for f in vuur.js subscribe.js contribute.js; do
            [ -f "functions/api/$f" ] || { echo "::error::functions/api/$f missing"; exit 1; }
          done
          grep -q 'braai-vuur' wrangler.toml || { echo "::error::wrangler.toml lost the braai-vuur binding"; exit 1; }

      - name: Check deploy secret is set
        id: secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN repo secret not set yet: skipping deploy. Add it under Settings → Secrets and variables → Actions, then re-run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.secret.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 784c671afe40889cab393265339deea9
          command: pages deploy --branch=main --commit-dirty=true

      - name: Verify live
        if: steps.secret.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' https://braai.co.za/)
          echo "home: $code"; [ "$code" = "200" ]
          curl -fsS https://braai.co.za/api/vuur | grep -Eq '"ok":\s*true'
          echo "api/vuur: ok"
