<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" font-family="'Segoe UI',Arial,sans-serif"><rect width="900" height="560" fill="#faf6f1"/><text x="40" y="52" font-size="30" font-weight="700" fill="#231c15">FROM FIRE TO BRAAI</text><text x="40" y="80" font-size="16" fill="#695d52">A fire is not yet a braai — the coals decide when. Full guide at braai.co.za/fire/</text><g transform="translate(150 230) scale(1.5)"><path d="M0 -60 C8 -38 24 -30 30 -12 C36 6 30 24 12 32 C20 18 16 6 4 -4 C-2 8 -14 12 -16 26 C-26 16 -30 0 -22 -18 C-14 -36 -4 -44 0 -60 Z" fill="#d04912"/><path d="M0 -28 C4 -16 12 -12 14 -2 C16 8 12 18 2 22 C6 12 2 4 -4 -2 C-8 6 -12 10 -12 18 C-18 10 -18 0 -12 -10 C-7 -18 -2 -20 0 -28 Z" fill="#f49d37"/></g><ellipse cx="150" cy="270" rx="80" ry="16" fill="#231c15"/><ellipse cx="88.0" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="108.66666666666667" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="129.33333333333334" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="150.0" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="170.66666666666669" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="191.33333333333331" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="212.0" cy="266" rx="13" ry="8" fill="#4a3a2c"/><text x="150" y="330" font-size="18" font-weight="700" text-anchor="middle" fill="#231c15">0–20 min</text><text x="150" y="354" font-size="14" text-anchor="middle" fill="#695d52">Flames. Lovely. Useless.</text><g transform="translate(390 230) scale(0.9)"><path d="M0 -60 C8 -38 24 -30 30 -12 C36 6 30 24 12 32 C20 18 16 6 4 -4 C-2 8 -14 12 -16 26 C-26 16 -30 0 -22 -18 C-14 -36 -4 -44 0 -60 Z" fill="#d04912"/><path d="M0 -28 C4 -16 12 -12 14 -2 C16 8 12 18 2 22 C6 12 2 4 -4 -2 C-8 6 -12 10 -12 18 C-18 10 -18 0 -12 -10 C-7 -18 -2 -20 0 -28 Z" fill="#f49d37"/></g><ellipse cx="390" cy="270" rx="80" ry="16" fill="#231c15"/><ellipse cx="328.0" cy="266" rx="13" ry="8" fill="#f49d37"/><ellipse cx="348.6666666666667" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="369.3333333333333" cy="266" rx="13" ry="8" fill="#f49d37"/><ellipse cx="390.0" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="410.6666666666667" cy="266" rx="13" ry="8" fill="#f49d37"/><ellipse cx="431.3333333333333" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="452.0" cy="266" rx="13" ry="8" fill="#f49d37"/><text x="390" y="330" font-size="18" font-weight="700" text-anchor="middle" fill="#231c15">±30 min</text><text x="390" y="354" font-size="14" text-anchor="middle" fill="#695d52">Flames dying, coals forming.</text><ellipse cx="630" cy="270" rx="80" ry="16" fill="#231c15"/><ellipse cx="568.0" cy="266" rx="13" ry="8" fill="#f49d37"/><ellipse cx="588.6666666666666" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="609.3333333333334" cy="266" rx="13" ry="8" fill="#f49d37"/><ellipse cx="630.0" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="650.6666666666666" cy="266" rx="13" ry="8" fill="#f49d37"/><ellipse cx="671.3333333333334" cy="266" rx="13" ry="8" fill="#4a3a2c"/><ellipse cx="692.0" cy="266" rx="13" ry="8" fill="#f49d37"/><text x="630" y="330" font-size="18" font-weight="700" text-anchor="middle" fill="#231c15">45–60 min</text><text x="630" y="354" font-size="14" text-anchor="middle" fill="#695d52">Grey ash, orange glow. NOW it's a braai.</text><text x="450" y="420" font-size="20" font-weight="700" text-anchor="middle" fill="#231c15">The hand test — palm at grid height, count the seconds</text><rect x="85" y="440" width="160" height="76" rx="10" fill="#fff" stroke="#e7ddd2"/><text x="165" y="468" font-size="20" font-weight="700" text-anchor="middle" fill="#d04912">4 s</text><text x="165" y="488" font-size="14" font-weight="700" text-anchor="middle" fill="#231c15">HOT</text><text x="165" y="506" font-size="12.5" text-anchor="middle" fill="#695d52">steak only</text><rect x="275" y="440" width="160" height="76" rx="10" fill="#fff" stroke="#e7ddd2"/><text x="355" y="468" font-size="20" font-weight="700" text-anchor="middle" fill="#d04912">6 s</text><text x="355" y="488" font-size="14" font-weight="700" text-anchor="middle" fill="#231c15">HOT-MED</text><text x="355" y="506" font-size="12.5" text-anchor="middle" fill="#695d52">tjops, pork neck</text><rect x="465" y="440" width="160" height="76" rx="10" fill="#fff" stroke="#e7ddd2"/><text x="545" y="468" font-size="20" font-weight="700" text-anchor="middle" fill="#d04912">8 s</text><text x="545" y="488" font-size="14" font-weight="700" text-anchor="middle" fill="#231c15">MEDIUM</text><text x="545" y="506" font-size="12.5" text-anchor="middle" fill="#695d52">wors, sosaties, ribs</text><rect x="655" y="440" width="160" height="76" rx="10" fill="#fff" stroke="#e7ddd2"/><text x="735" y="468" font-size="20" font-weight="700" text-anchor="middle" fill="#d04912">10+ s</text><text x="735" y="488" font-size="14" font-weight="700" text-anchor="middle" fill="#231c15">GENTLE</text><text x="735" y="506" font-size="12.5" text-anchor="middle" fill="#695d52">broodjies, roosterkoek</text><text x="860" y="536" font-size="14" text-anchor="end" fill="#695d52">braai.co.za</text></svg>