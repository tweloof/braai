# Temporary preview only. Removed before the pull request is finished.
# Deploys this branch as a Cloudflare Pages preview. It does not deploy main.
name: Temporary Index preview

on:
  push:
    branches: [cursor/braai-index-week-2026-11-16-a076]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy branch preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 784c671afe40889cab393265339deea9
          command: pages deploy --branch=cursor/braai-index-week-2026-11-16-a076 --commit-dirty=true
