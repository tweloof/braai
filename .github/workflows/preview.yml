# One-off Pages preview for the 26 Oct – 1 Nov 2026 Index refresh.
# Deploys this branch only. Production stays on the main-branch workflow.
name: Pages preview

on:
  push:
    branches:
      - cursor/braai-index-week-2026-10-26-188a

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preview deploy (not production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 784c671afe40889cab393265339deea9
          command: pages deploy --branch=cursor/braai-index-week-2026-10-26-188a --commit-dirty=true
